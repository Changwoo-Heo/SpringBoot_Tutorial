services:
  db:
      container_name: postgres-spring-boot
      image: postgres:latest
      environment:
        POSTGRES_USER: rogo0722
        POSTGRES_PASSWORD: password
        PGDATA: /data/postgres
      volumes:
        - db:/data/postgres
      ports:
        ### by default postgres run in 5432 port, but changed to 5332 as 5432 might be in use
        - "5332:5432"
      networks:
        - db
      restart: unless-stopped

networks:
  db:
    driver: bridge

volumes:
  db:
